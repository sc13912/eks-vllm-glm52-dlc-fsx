# ClusterIP service for the vLLM leader (intra-cluster testing only).
# Reachable in-cluster at:  http://glm52-leader.default.svc.cluster.local:8000   (vLLM OpenAI API)
#                           http://glm52-leader.default.svc.cluster.local:8265   (Ray dashboard)
# Or from your workstation (still internal — creates NO load balancer):
#   kubectl port-forward svc/glm52-leader 8000:8000
apiVersion: v1
kind: Service
metadata:
  name: glm52-leader
  namespace: default
  labels: { app: glm52 }
spec:
  type: ClusterIP
  selector:
    leaderworkerset.sigs.k8s.io/name: glm52
    role: leader
  ports:
    - { name: http,     port: 8000, targetPort: 8000 }
    - { name: ray-dash, port: 8265, targetPort: 8265 }

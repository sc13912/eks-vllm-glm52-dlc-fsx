# Throwaway pod for FSx for Lustre mount testing.
# Prereq: the FSx PV + PVC (fsx-glm52-pvc) must already be applied and Bound.
#
# NOTE: the Lustre client (`lfs`) is NOT in the base image, so the container installs
# lustre-client on startup. Give it ~30-60s after Ready before the first `lfs` call
# (or the initial exec will say "command not found" until the dnf install finishes).
apiVersion: v1
kind: Pod
metadata:
  name: fsx-test
  namespace: default
  labels:
    app: fsx-test
spec:
  nodeSelector:
    role: system
  restartPolicy: Never
  containers:
    - name: fsx-test
      image: amazonlinux:2023
      # Install the Lustre client so `lfs` is available, then idle.
      command: ["/bin/bash", "-c"]
      args:
        - |
          dnf install -y lustre-client >/dev/null 2>&1 || echo "WARN: lustre-client install failed (lfs may be unavailable)"
          echo "fsx-test ready — lfs $(command -v lfs || echo NOT_FOUND)"
          sleep infinity
      volumeMounts:
        - name: fsx
          mountPath: /mnt/fsx
  volumes:
    - name: fsx
      persistentVolumeClaim:
        claimName: fsx-glm52-pvc

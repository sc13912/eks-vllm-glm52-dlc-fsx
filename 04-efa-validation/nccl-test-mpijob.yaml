apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-tests
  namespace: default
spec:
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 20
  slotsPerWorker: 8                      # GPUs per node
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: test-nccl-launcher
              image: public.ecr.aws/hpc-cloud/nccl-tests:cuda13.0.2-efa1.48.0-ofiv1.19.0-ncclv2.30.4-1-testsv2.18.3
              imagePullPolicy: IfNotPresent
              env:
                - name: PATH
                  value: $PATH:/opt/amazon/efa/bin:/usr/bin
              command:
                - /opt/amazon/openmpi/bin/mpirun
                - --allow-run-as-root
                - --tag-output
                - -np
                - "16"                    # 2 nodes x 8 GPUs
                - -N
                - "8"                     # 8 ranks per node
                - --bind-to
                - none
                - -x
                - PATH
                - -x
                - LD_LIBRARY_PATH
                - -x
                - FI_PROVIDER=efa                 # force EFA; fail loud instead of silent TCP fallback
                - -x
                - FI_EFA_USE_DEVICE_RDMA=1         # GPUDirect RDMA over EFA (the thing we're validating)
                - -x
                - FI_EFA_FORK_SAFE=1
                - -x
                - NCCL_DEBUG=INFO
                - -x
                - NCCL_BUFFSIZE=8388608
                - -x
                - NCCL_P2P_NET_CHUNKSIZE=524288
                - -x
                - NCCL_TUNER_PLUGIN=/opt/amazon/ofi-nccl/lib/x86_64-linux-gnu/libnccl-ofi-tuner.so
                - --mca
                - pml
                - ^cm,ucx
                - --mca
                - btl
                - tcp,self
                - --mca
                - btl_tcp_if_exclude
                - lo,docker0,veth_def_agent
                - /opt/nccl-tests/build/all_reduce_perf
                - -b
                - "8"                     # min message size 8 B
                - -e
                - "16G"                   # max message size 16 GiB
                - -f
                - "2"                     # step factor 2
                - -g
                - "1"                     # 1 GPU per MPI rank (MPI owns rank<->GPU mapping)
                - -c
                - "1"                     # correctness check ON (must report 0 wrong)
                - -n
                - "100"                   # iterations
    Worker:
      replicas: 2
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/instance-type: p5en.48xlarge
          containers:
            - name: nccl-tests-worker
              image: public.ecr.aws/hpc-cloud/nccl-tests:cuda13.0.2-efa1.48.0-ofiv1.19.0-ncclv2.30.4-1-testsv2.18.3
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
              resources:
                limits:
                  nvidia.com/gpu: 8
                  hugepages-2Mi: 5120Mi
                  vpc.amazonaws.com/efa: 16     # p5en.48xlarge = 16 EFA cards 
                  memory: 32000Mi
                requests:
                  nvidia.com/gpu: 8
                  hugepages-2Mi: 5120Mi
                  vpc.amazonaws.com/efa: 16
                  memory: 32000Mi
          volumes:
            - name: shmem
              hostPath:
                path: /dev/shm
